name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Install nginx
        run: sudo apt-get update -q && sudo apt-get install -y -q nginx
      - name: Run unit and real HTTP proxy tests
        run: python3 -B -m unittest discover -s tests -v
